
name: Build Signed NASSAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools \
            "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NASSAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing keystore secret"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nassar-release.jks"
          chmod 600 "$RUNNER_TEMP/nassar-release.jks"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.NASSAR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NASSAR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NASSAR_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"

          mkdir -p signed-apk

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED" \
            signed-apk/nassar-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/nassar-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed-apk/NASSAR-Accounting.apk \
            signed-apk/nassar-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            signed-apk/NASSAR-Accounting.apk

          rm -f signed-apk/nassar-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NASSAR-Signed-APK
          path: signed-apk/NASSAR-Accounting.apk
          if-no-files-found: error
          retention-days: 7
